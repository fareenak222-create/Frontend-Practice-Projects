<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonus Project</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo"><img src="images/logo.gif" alt="logo" width="100px"></div>

        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Calculator</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>

    <!-- Hero -->

    <section class="hero">

        <h1>Flexbox, Grid & JavaScript Project</h1>

        <p>
            Responsive mini website created using HTML, CSS and JavaScript.
        </p>

    </section>

    <!-- Gallery -->

    <section class="gallery-section">

        <h2>Image Gallery</h2>

        <div class="gallery">

            <img src="images/img1.jpg" alt="image 1">
            <img src="images/img2.jpg" alt="image 2">
            <img src="images/img3.jpg" alt="image 3">
            <img src="images/img4.jpg" alt="image 4">
            <img src="images/img5.jpg" alt="image 5">
            <img src="images/img6.jpg" alt="image 6">

        </div>

    </section>

    <!-- Calculator -->

    <section class="calculator">

        <h2>Simple Calculator</h2>

        <input type="number" id="num1" placeholder="First Number">

        <input type="number" id="num2" placeholder="Second Number">

        <button onclick="calculate()">
            Calculate
        </button>

        <div id="result"></div>

    </section>

    <script src="script.js"></script>

</body>
</html>
